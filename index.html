<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Arca - App Iglesia</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #estado { font-weight: bold; }
    </style>
</head>
<body>
    
    <h1>Sistema El Arca</h1>
    <p id="estado" style="color: orange;">Conectando a los servidores...</p>

    <!-- Código unificado para evitar errores 404 de GitHub Pages -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // Credenciales de tu proyecto en Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDJbcs6gzCkQym6CS_kTYEG0E7rb5jXMTQ",
            authDomain: "app-iglesia-core.firebaseapp.com",
            projectId: "app-iglesia-core",
            storageBucket: "app-iglesia-core.firebasestorage.app",
            messagingSenderId: "710025721588",
            appId: "1:710025721588:web:6dd4dd0e49628b7d9bd0a1",
            measurementId: "G-DLS54C56XM"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Comprobar conexión en pantalla
        document.addEventListener("DOMContentLoaded", () => {
            const estado = document.getElementById('estado');
            
            if (db && auth) {
                estado.textContent = "¡Conexión exitosa a la base de datos de Firebase!";
                estado.style.color = "green";
                console.log("Servicios de backend listos para operar.");
            } else {
                estado.textContent = "Error al conectar con la base de datos.";
                estado.style.color = "red";
            }
        });
    </script>
</body>
</html>
