<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Arca - App Iglesia</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9;}
        h1, h2, h3 { color: #333; margin-top: 0; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 4px rgba(0,00,0.1); margin-bottom: 20px; }
        .success { color: #0f5132; background-color: #d1e7dd; padding: 10px; border-radius: 4px; font-weight: bold; border: 1px solid #badbcc;}
        .error { color: red; font-weight: bold;}
        ul, ol { padding-left: 20px; }
        li { margin-bottom: 5px; }
        
        #login-container { max-width: 400px; margin: 0 auto; }
        input, textarea, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit;}
        button { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold;}
        button:hover { background-color: #0056b3; }
        .btn-rojo { background-color: #dc3545; width: auto; margin-bottom: 20px;}
        .btn-rojo:hover { background-color: #c82333; }
        
        /* Estilos específicos para el Panel de Administrador */
        .admin-panel { border: 2px solid #ff9800; background-color: #fff8e1; display: none; }
        .botones-admin { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; margin-bottom: 20px;}
        .btn-admin { background-color: #ff9800; width: auto; flex: 1; min-width: 150px; }
        .btn-admin:hover { background-color: #e68a00; }
        .btn-finanzas { background-color: #28a745; }
        .btn-finanzas:hover { background-color: #218838; }

        /* Estilos para formularios de gestión */
        .gestion-form { background-color: white; padding: 15px; border-radius: 5px; border: 1px solid #ffcc80; margin-top: 15px;}
        .gestion-form button { background-color: #ff9800; }
        .gestion-form button:hover { background-color: #e68a00; }

        #dashboard-container { display: none; }
    </style>
</head>
<body>
    
    <h1>Sistema El Arca</h1>
    <p id="estado" style="color: orange; font-weight: bold;">Verificando seguridad...</p>

    <!-- PANTALLA DE INICIO DE SESIÓN -->
    <div class="card" id="login-container">
        <h2>Iniciar Sesión</h2>
        <form id="login-form">
            <input type="email" id="email" placeholder="Correo electrónico" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button type="submit">Ingresar</button>
        </form>
        <p id="login-error" class="error"></p>
    </div>

    <!-- SISTEMA INTERNO -->
    <div id="dashboard-container">
        <button id="btn-logout" class="btn-rojo">Cerrar Sesión</button>

        <!-- PANEL EXCLUSIVO PARA ADMINISTRADORES -->
        <div class="card admin-panel" id="admin-panel">
            <h2>⚙️ Panel de Administración</h2>
            <p>Opciones exclusivas de configuración y control.</p>
            
            <div class="botones-admin">
                <button class="btn-admin" id="btn-gestion-usuarios">Gestionar Usuarios</button>
                <button class="btn-admin" id="btn-config-catalogos">Configurar Catálogos</button>
                <button class="btn-admin btn-finanzas" id="btn-modulo-finanzas">💰 Módulo Finanzas</button>
            </div>

            <!-- FORMULARIO PARA AGREGAR MINISTERIO -->
            <div class="gestion-form">
                <h3>Agregar Nuevo Ministerio</h3>
                <form id="form-nuevo-ministerio">
                    <input type="text" id="min-nombre" placeholder="Nombre del Ministerio (ej. Jóvenes)" required>
                    <textarea id="min-descripcion" rows="2" placeholder="Descripción breve" required></textarea>
                    <button type="submit">Guardar Ministerio</button>
                    <p id="min-mensaje"></p>
                </form>
            </div>
        </div>

        <div class="card" id="modulo-ministerios">
            <h2>Ministerios Activos</h2>
            <ul id="lista-ministerios">
                <li>Cargando ministerios...</li>
            </ul>
        </div>

        <div class="card" id="modulo-formacion">
            <h2>Ruta de Formación</h2>
            <ol id="lista-formacion">
                <li>Cargando etapas...</li>
            </ol>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        // Importamos addDoc para poder escribir datos nuevos
        import { getFirestore, collection, getDocs, doc, getDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJbcs6gzCkQym6CS_kTYEG0E7rb5jXMTQ",
            authDomain: "app-iglesia-core.firebaseapp.com",
            projectId: "app-iglesia-core",
            storageBucket: "app-iglesia-core.firebasestorage.app",
            messagingSenderId: "710025721588",
            appId: "1:710025721588:web:6dd4dd0e49628b7d9bd0a1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app); 

        const estado = document.getElementById('estado');
        const loginContainer = document.getElementById('login-container');
        const dashboardContainer = document.getElementById('dashboard-container');
        const adminPanel = document.getElementById('admin-panel');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const btnLogout = document.getElementById('btn-logout');
        const listaMinisterios = document.getElementById('lista-ministerios');
        const listaFormacion = document.getElementById('lista-formacion');
        
        // Elementos del nuevo formulario
        const formNuevoMinisterio = document.getElementById('form-nuevo-ministerio');
        const minMensaje = document.getElementById('min-mensaje');

        // 1. EL VIGILANTE
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const userDocRef = doc(db, "usuarios", user.uid);
                    const userDoc = await getDoc(userDocRef);

                    if (userDoc.exists()) {
                        const datosUsuario = userDoc.data();
                        estado.textContent = `Bienvenido(a), ${datosUsuario.nombre} | Perfil: ${datosUsuario.perfilAcceso}`;
                        
                        if (datosUsuario.perfilAcceso === "Administrador") {
                            adminPanel.style.display = "block"; 
                        } else {
                            adminPanel.style.display = "none";  
                        }
                    } else {
                        estado.textContent = `Sesión iniciada: ${user.email} (Perfil no configurado)`;
                        adminPanel.style.display = "none";
                    }
                } catch (error) {
                    console.error("Error al leer perfil:", error);
                    estado.textContent = "Error al verificar permisos de usuario.";
                }

                estado.className = "success";
                loginContainer.style.display = "none";
                dashboardContainer.style.display = "block";
                
                cargarDatosBaseDeDatos();
            } else {
                estado.textContent = "Por favor, inicia sesión para acceder al sistema.";
                estado.className = "";
                estado.style.color = "black";
                loginContainer.style.display = "block";
                dashboardContainer.style.display = "none";
                adminPanel.style.display = "none"; 
            }
        });

        // 2. ACCIÓN DE LOGIN
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            loginError.textContent = "Validando credenciales...";

            signInWithEmailAndPassword(auth, email, password)
                .then(() => {
                    loginError.textContent = "";
                    loginForm.reset();
                })
                .catch((error) => {
                    console.error("Error de login:", error);
                    loginError.textContent = "Correo o contraseña incorrectos.";
                });
        });

        // 3. ACCIÓN DE LOGOUT
        btnLogout.addEventListener('click', () => {
            signOut(auth).catch((error) => console.error("Error al cerrar sesión:", error));
        });

        // 4. LECTURA DE DATOS
        async function cargarDatosBaseDeDatos() {
            try {
                const ministeriosSnapshot = await getDocs(collection(db, "ministerios"));
                listaMinisterios.innerHTML = ""; 
                
                if (ministeriosSnapshot.empty) {
                     listaMinisterios.innerHTML = "<li>No hay ministerios registrados.</li>";
                } else {
                     ministeriosSnapshot.forEach((doc) => {
                        const min = doc.data();
                        if(min.estado) {
                            listaMinisterios.innerHTML += `<li><strong>${min.nombre}</strong>: ${min.descripcion}</li>`;
                        }
                    });
                }

                const docRef = doc(db, "configuracion", "etapas_formacion");
                const docSnap = await getDoc(docRef);
                listaFormacion.innerHTML = ""; 

                if (docSnap.exists()) {
                    const etapas = docSnap.data().lista;
                    etapas.forEach(etapa => {
                        listaFormacion.innerHTML += `<li>${etapa}</li>`;
                    });
                } else {
                    listaFormacion.innerHTML = "<li>No se encontró configuración de formación.</li>";
                }
            } catch (error) {
                console.error("Error leyendo Firestore:", error);
                estado.textContent = "Error al cargar los datos. Revisa la consola (F12).";
                estado.className = "error";
            }
        }

        // 5. ACCIÓN: CREAR NUEVO MINISTERIO
        formNuevoMinisterio.addEventListener('submit', async (e) => {
            e.preventDefault(); // Evita que la página se recargue
            
            const nombre = document.getElementById('min-nombre').value;
            const descripcion = document.getElementById('min-descripcion').value;
            
            minMensaje.textContent = "Guardando...";
            minMensaje.style.color = "orange";

            try {
                // Escribimos en Firestore
                await addDoc(collection(db, "ministerios"), {
                    nombre: nombre,
                    descripcion: descripcion,
                    estado: true // Por defecto lo creamos activo
                });
                
                minMensaje.textContent = "¡Ministerio guardado con éxito!";
                minMensaje.style.color = "green";
                formNuevoMinisterio.reset(); // Limpiamos el formulario
                
                // Recargamos la lista visualmente
                cargarDatosBaseDeDatos(); 
                
                // Borramos el mensaje de éxito después de 3 segundos
                setTimeout(() => { minMensaje.textContent = ""; }, 3000);

            } catch (error) {
                console.error("Error al crear ministerio:", error);
                minMensaje.textContent = "Error al guardar. Revisa tus permisos.";
                minMensaje.style.color = "red";
            }
        });

    </script>
</body>
</html>
